global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:4000"]
    metrics_path: /metrics

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:4001"]
    metrics_path: /metrics

  - job_name: "project-service"
    static_configs:
      - targets: ["project-service:4002"]
    metrics_path: /metrics

  - job_name: "job-service"
    static_configs:
      - targets: ["job-service:4003"]
    metrics_path: /metrics

  - job_name: "file-service"
    static_configs:
      - targets: ["file-service:4004"]
    metrics_path: /metrics

  - job_name: "mcp-server"
    static_configs:
      - targets: ["mcp-server:4005"]
    metrics_path: /metrics

  - job_name: "feature-flags"
    static_configs:
      - targets: ["feature-flags:4010"]
    metrics_path: /metrics

  - job_name: "incident-service"
    static_configs:
      - targets: ["incident-service:4006"]
    metrics_path: /metrics
